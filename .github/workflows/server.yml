name: Server

on:
  push:
    paths:
      - "server/**"
      - "deploy/**"
      - ".github/workflows/server.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false

      - name: Test
        working-directory: server
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; echo "::error::gofmt"; exit 1; }
          go vet ./...
          go test -race -count=1 ./...

      - name: Build
        working-directory: server
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p ../dist
          for arch in amd64 arm64; do
            GOOS=linux GOARCH=$arch go build -trimpath -buildvcs=false \
              -ldflags "-s -w -X main.Version=server-${{ github.run_number }}" \
              -o ../dist/simvault-linux-$arch .
          done

      - name: Package deploy files
        run: |
          cp deploy/simvault.service deploy/Caddyfile.snippet deploy/backup.sh dist/
          sed "s/__RELEASE__/server-${{ github.run_number }}/" deploy/install.sh > dist/install.sh
          bash -n dist/install.sh
          cd dist && sha256sum simvault-linux-* simvault.service Caddyfile.snippet backup.sh install.sh > SHA256SUMS
          cat SHA256SUMS

      - name: Publish release
        if: github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "server-${{ github.run_number }}" dist/* \
            --target "${{ github.sha }}" --prerelease \
            --title "Сервер Учёт SIM · server-${{ github.run_number }}" \
            --notes "Установка/обновление на VPS:
          \`\`\`
          curl -fsSLO https://github.com/${{ github.repository }}/releases/download/server-${{ github.run_number }}/install.sh
          sudo bash install.sh
          \`\`\`
          Контрольные суммы — в SHA256SUMS. Ветка: ${{ github.ref_name }}"
