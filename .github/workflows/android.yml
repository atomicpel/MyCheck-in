name: Android APK

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Необязательно: постоянный ключ подписи из секретов репозитория,
      # чтобы новые версии ставились поверх старых.
      - name: Restore signing key
        if: env.SIGNING_KEYSTORE_BASE64 != ''
        run: echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > release.jks

      - name: Fetch Tesseract Russian model
        run: ./scripts/fetch-tessdata.sh

      - name: Test core and build APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew :core:test :app:assembleRelease --stacktrace 2>&1 | tee build.log

      # При ошибке — первые ошибки компиляции в аннотации запуска (видны без скачивания логов).
      - name: Report build errors
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|FAILED|> .*Exception" build.log | head -40 | while IFS= read -r line; do
            echo "::error::${line}"
          done || true

      # Проверка итогового APK: разрешения и наличие словаря Tesseract.
      - name: Verify APK
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          AAPT2="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/aapt2"
          "$AAPT2" dump badging "$APK" | grep -E "^package:|sdkVersion|uses-permission|native-code"
          unzip -l "$APK" | grep "assets/tessdata/rus.traineddata"

      - name: Name APK
        run: cp app/build/outputs/apk/release/app-release.apk "../MyCheckIn-Scanner-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: MyCheckIn-Scanner-apk
          path: MyCheckIn-Scanner-*.apk

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-${{ github.run_number }}" ../MyCheckIn-Scanner-*.apk \
            --target "${{ github.sha }}" --prerelease \
            --title "Учёт SIM, сборка ${{ github.run_number }}" \
            --notes "APK сканера паспорта РФ: MRZ + все поля разворота, фото владельца, учёт SIM-карт: загрузка номеров и SIM из МТС Бизнес (несколько доступов), поиск, паспорт владельца, внесение данных в МТС и статус. Скачайте файл на телефон и установите (разрешите установку из этого источника)."
